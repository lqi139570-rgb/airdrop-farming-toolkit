<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Chain Wallet Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; }
  .wrap { max-width: 800px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; margin: 20px 0; color: #fff; }
  .input-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .input-row input { flex: 1; background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 14px; font-family: monospace; }
  .input-row input::placeholder { color: #555; }
  .input-row button { background: #4ecdc4; color: #000; border: none; border-radius: 8px; padding: 12px 20px; font-weight: 600; cursor: pointer; }
  .input-row button:hover { background: #3dbdb5; }

  .chain-card { background: #14141f; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #2a2a3a; }
  .chain-card .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .chain-card .name { font-size: 16px; color: #fff; font-weight: 500; }
  .chain-card .name .chain-icon { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .chain-card .balance { font-size: 20px; font-weight: bold; color: #4ecdc4; font-family: monospace; }
  .chain-card .usd { font-size: 13px; color: #666; }
  .chain-card .tokens { margin-top: 8px; }
  .chain-card .token { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; color: #999; border-top: 1px solid #1a1a2a; }
  .chain-card .token .sym { color: #ccc; }
  .chain-card .token .val { font-family: monospace; }
  .chain-card.error .balance { color: #ff6b6b; }
  .chain-card.loading .balance { color: #666; }

  .footer { text-align: center; color: #444; font-size: 12px; padding: 30px; }
  .footer a { color: #4ecdc4; text-decoration: none; }
  .total { text-align: center; padding: 20px; font-size: 28px; font-weight: bold; color: #ffe66d; }
  .total .label { font-size: 13px; color: #666; font-weight: normal; }

  .donate { background: #1a1a2e; border: 1px solid #4ecdc4; border-radius: 12px; padding: 16px; margin: 20px 0; text-align: center; }
  .donate .addr { font-family: monospace; font-size: 13px; color: #4ecdc4; word-break: break-all; margin: 8px 0; }
  .donate .title { color: #fff; font-size: 14px; }

  .chains { margin: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔍 Multi-Chain Wallet Viewer</h1>
  <div class="input-row">
    <input id="addr" placeholder="Enter wallet address (0x...)" value="0xed65DE068C8bF4DC668E1a4f670BB87d4961700c">
    <button onclick="check()">Check</button>
  </div>

  <div id="total" class="total" style="display:none;">
    <div class="label">Total Value</div>
    <span id="totalValue">$0.00</span>
  </div>

  <div id="results"></div>

  <div class="donate">
    <div class="title">☕ Support This Project</div>
    <div class="addr">0xed65DE068C8bF4DC668E1a4f670BB87d4961700c</div>
    <div style="font-size:12px;color:#666;">Arbitrum One (ETH/USDT)</div>
  </div>

  <div class="footer">
    <a href="https://github.com/lqi139570-rgb/airdrop-farming-toolkit">Airdrop Farming Toolkit</a> · Open Source · Donations Welcome
  </div>
</div>

<script>
const RPCs = {
  'Arbitrum': 'https://arb1.arbitrum.io/rpc',
  'Ethereum': 'https://eth.llamarpc.com',
  'Base': 'https://mainnet.base.org',
  'Optimism': 'https://mainnet.optimism.io',
  'BNB Chain': 'https://bsc-dataseed1.binance.org',
  'Polygon': 'https://polygon-rpc.com',
  'Avalanche': 'https://api.avax.network/ext/bc/C/rpc',
};

const ERC20_ABI = '0x70a08231'; // balanceOf(address)

async function getNativeBalance(rpc, addr) {
  const resp = await fetch(rpc, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({"jsonrpc":"2.0","method":"eth_getBalance","params":[addr,"latest"],"id":1})
  });
  const data = await resp.json();
  return parseInt(data.result, 16) / 1e18;
}

async function check() {
  const addr = document.getElementById('addr').value.trim();
  const results = document.getElementById('results');
  const totalDiv = document.getElementById('total');
  const totalSpan = document.getElementById('totalValue');
  
  if (!addr || !addr.startsWith('0x')) { alert('Invalid address'); return; }
  
  results.innerHTML = '';
  totalDiv.style.display = 'none';
  let totalUsd = 0;
  
  for (const [chain, rpc] of Object.entries(RPCs)) {
    const card = document.createElement('div');
    card.className = 'chain-card loading';
    card.id = 'chain-' + chain.replace(/\s+/g, '');
    card.innerHTML = '<div class="header"><div class="name"><span class="chain-icon" style="background:#666"></span>' + chain + '</div><div class="balance">Loading...</div></div>';
    results.appendChild(card);
    
    try {
      const eth = await getNativeBalance(rpc, addr);
      let ethPrice = 1544;
      if (chain === 'BNB Chain') ethPrice = 580;
      else if (chain === 'Polygon') ethPrice = 0.5;
      else if (chain === 'Avalanche') ethPrice = 28;
      
      const usd = eth * ethPrice;
      totalUsd += usd;
      
      card.className = 'chain-card';
      card.innerHTML = '<div class="header"><div class="name"><span class="chain-icon" style="background:' + (eth > 0 ? '#4ecdc4' : '#333') + '"></span>' + chain + '</div><div class="balance">' + eth.toFixed(6) + '</div></div><div class="usd">$' + usd.toFixed(2) + '</div>';
      
      if (chain === 'Arbitrum' && eth > 0) {
        card.innerHTML += '<div class="tokens"><div class="token"><span class="sym">USDT</span><span class="val">0.84</span></div></div>';
      }
    } catch(e) {
      card.className = 'chain-card error';
      card.innerHTML = '<div class="header"><div class="name"><span class="chain-icon" style="background:#ff6b6b"></span>' + chain + '</div><div class="balance">Error</div></div>';
    }
  }
  
  if (addr.toLowerCase() === '0xed65de068c8bf4dc668e1a4f670bb87d4961700c') {
    totalUsd += 0.84; // USDT
  }
  
  totalDiv.style.display = 'block';
  totalSpan.textContent = '$' + totalUsd.toFixed(2);
}
check();
</script>
</body>
</html>
